<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식당 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1c1a;
    --ink-soft: #6b6a63;
    --line: #e2e0d6;
    --line-soft: #ebe9df;
    --card: #fdfcf7;
    --field: #ffffff;
    --green: #2f5d43;
    --accent: #c96a3a;
    --danger: #c0503f;
    --btn: #1f1f1d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 56px 24px 80px;
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 600px at 100% 0%, #f8f1e2 0%, rgba(248,241,226,0) 55%),
      radial-gradient(900px 700px at 0% 100%, #eef1e5 0%, rgba(238,241,229,0) 60%),
      linear-gradient(160deg, #f5f3ec 0%, #eef0e6 100%);
    background-attachment: fixed;
  }

  .wrap { max-width: 1120px; margin: 0 auto; }

  /* ---------- 히어로 ---------- */
  .hero { padding: 0 8px 44px; }

  .hero h1 {
    margin: 0;
    font-family: "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    font-weight: 800;
    font-size: clamp(44px, 7vw, 92px);
    line-height: 1.18;
    letter-spacing: -0.01em;
  }

  .hero p {
    margin: 26px 0 0;
    font-size: 16px;
    color: var(--ink-soft);
  }

  /* ---------- 카드 ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 56px clamp(24px, 5vw, 64px) 60px;
    box-shadow: 0 24px 60px -40px rgba(40, 40, 30, 0.35);
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 44px;
  }

  .card-head h2 {
    margin: 0 0 10px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .card-head p { margin: 0; font-size: 15px; color: var(--ink-soft); }

  .required-note { font-size: 13px; color: var(--accent); white-space: nowrap; }

  /* ---------- 섹션 ---------- */
  .section-label {
    margin: 0 0 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--green);
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px 28px;
  }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

  .full { grid-column: 1 / -1; }

  .field label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .field label .star { color: var(--accent); }

  .control {
    width: 100%;
    padding: 18px 18px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .control::placeholder { color: #a9a79d; }

  .control:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(47, 93, 67, 0.12);
  }

  select.control {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%231c1c1a' stroke-width='1.4'><path d='M3 6l5 5 5-5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 18px center;
    padding-right: 46px;
  }

  select.control:invalid, select.control.placeholder { color: #8d8b82; }

  .control.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(192, 80, 63, 0.10); }

  /* ---------- 체크박스 ---------- */
  .check {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 22px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, background .15s;
  }

  .check input { position: absolute; opacity: 0; pointer-events: none; }

  .check .box {
    width: 20px; height: 20px;
    flex: 0 0 20px;
    border: 1px solid #c9c7bc;
    border-radius: 4px;
    background: #fff;
    display: grid;
    place-items: center;
  }

  .check .box::after {
    content: "";
    width: 10px; height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) scale(0.4);
    opacity: 0;
    transition: opacity .12s, transform .12s;
  }

  .check span { font-size: 16px; }

  .check:has(input:checked) { border-color: var(--green); background: #f4f7f2; }
  .check:has(input:checked) .box { background: var(--green); border-color: var(--green); }
  .check:has(input:checked) .box::after { opacity: 1; transform: rotate(-45deg) scale(1); }
  .check:has(input:focus-visible) { box-shadow: 0 0 0 3px rgba(47, 93, 67, 0.12); }

  /* ---------- 하단 ---------- */
  hr.divider { margin: 48px 0 40px; border: 0; border-top: 1px solid var(--line-soft); }

  .actions { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }

  .submit {
    padding: 22px 34px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--btn);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity .15s, transform .05s;
  }

  .submit:hover { opacity: .88; }
  .submit:active { transform: translateY(1px); }
  .submit.done { background: var(--green); cursor: default; }

  .status { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .status.warn { color: var(--danger); }
  .status.ready { color: var(--green); }

  .summary {
    display: none;
    margin-top: 32px;
    padding: 26px 28px;
    background: #f4f7f2;
    border: 1px solid #d8e3d8;
    border-radius: 8px;
  }

  .summary.show { display: block; }
  .summary h4 { margin: 0 0 16px; font-size: 15px; font-weight: 700; color: var(--green); }
  .summary dl { display: grid; grid-template-columns: 100px 1fr; gap: 10px 16px; margin: 0; font-size: 15px; }
  .summary dt { color: var(--ink-soft); }
  .summary dd { margin: 0; font-weight: 500; }

  @media (max-width: 760px) {
    body { padding: 36px 16px 60px; }
    .grid, .grid-3 { grid-template-columns: 1fr; }
    .card { padding: 36px 22px 44px; }
    .card-head { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ①② 히어로 -->
  <header class="hero">
    <h1>좋은 식사는<br>좋은 자리에서.</h1>
    <p>원하는 지역과 취향을 골라 오늘의 식당을 예약해 보세요.</p>
  </header>

  <main class="card">
    <!-- ③④ 카드 헤더 -->
    <div class="card-head">
      <div>
        <h2>식당 예약</h2>
        <p>방문 정보를 간단히 남겨주세요.</p>
      </div>
      <div class="required-note">* 필수 입력</div>
    </div>

    <form id="reserve-form" novalidate>
      <!-- ⑤ VISIT DETAILS -->
      <h3 class="section-label">Visit Details</h3>
      <div class="grid">
        <!-- ⑥ 지역 -->
        <div class="field">
          <label for="region">지역 <span class="star">*</span></label>
          <select id="region" class="control placeholder">
            <option value="">선택하세요</option>
            <option>강남</option>
            <option>홍대</option>
            <option>이태원</option>
            <option>성수</option>
            <option>여의도</option>
          </select>
        </div>

        <!-- ⑦ 종류 -->
        <div class="field">
          <label for="cuisine">종류 <span class="star">*</span></label>
          <select id="cuisine" class="control placeholder">
            <option value="">선택하세요</option>
            <option>한식</option>
            <option>일식</option>
            <option>중식</option>
            <option>양식</option>
            <option>카페</option>
          </select>
        </div>

        <!-- ⑧ 가격대 -->
        <div class="field">
          <label for="price">가격대 <span class="star">*</span></label>
          <select id="price" class="control placeholder">
            <option value="">선택하세요</option>
            <option>1만원 이하</option>
            <option>1만 - 2만원</option>
            <option>2만 - 3만원</option>
            <option>3만원 이상</option>
          </select>
        </div>

        <!-- ⑨ 예약 인원 -->
        <div class="field">
          <label for="people">예약 인원 <span class="star">*</span></label>
          <input id="people" class="control" type="number" min="1" max="20" step="1" placeholder="1 - 20명">
        </div>

        <!-- ⑩ 예약 시간 -->
        <div class="field full">
          <label for="time">예약 시간 <span class="star">*</span></label>
          <input id="time" class="control" type="time">
        </div>
      </div>

      <!-- ⑪⑫ TABLE PREFERENCES -->
      <h3 class="section-label" style="margin-top:44px">Table Preferences</h3>
      <div class="grid-3">
        <label class="check"><input type="checkbox" name="pref" value="야외석"><span class="box"></span><span>야외석</span></label>
        <label class="check"><input type="checkbox" name="pref" value="주차"><span class="box"></span><span>주차</span></label>
        <label class="check"><input type="checkbox" name="pref" value="인터넷"><span class="box"></span><span>인터넷</span></label>
      </div>

      <hr class="divider">

      <!-- ⑬⑭ 하단 액션 -->
      <div class="actions">
        <button type="submit" class="submit" id="submit-btn">예약하기 &rarr;</button>
        <p class="status" id="status">입력 내용을 확인해 주세요.</p>
      </div>

      <div class="summary" id="summary">
        <h4>예약 내용</h4>
        <dl>
          <dt>지역</dt><dd id="s-region"></dd>
          <dt>종류</dt><dd id="s-cuisine"></dd>
          <dt>가격대</dt><dd id="s-price"></dd>
          <dt>인원</dt><dd id="s-people"></dd>
          <dt>시간</dt><dd id="s-time"></dd>
          <dt>좌석 취향</dt><dd id="s-prefs"></dd>
        </dl>
      </div>
    </form>
  </main>
</div>

<script>
// ---------- Data 층: 슬롯 ----------
const formData = {
  region: "",   // string,   mutable, ""
  cuisine: "",  // string,   mutable, ""
  price: "",    // string,   mutable, ""
  people: "",   // number|"",mutable, "" (1-20)
  time: "",     // "HH:MM",  mutable, ""
  prefs: []     // string[], append,  []
};

const REQUIRED = [
  { key: "region",  el: document.getElementById("region"),  label: "지역" },
  { key: "cuisine", el: document.getElementById("cuisine"), label: "종류" },
  { key: "price",   el: document.getElementById("price"),   label: "가격대" },
  { key: "people",  el: document.getElementById("people"),  label: "예약 인원" },
  { key: "time",    el: document.getElementById("time"),    label: "예약 시간" }
];

const statusEl = document.getElementById("status");
const btn = document.getElementById("submit-btn");
const summary = document.getElementById("summary");
let submitted = false;

// ---------- Logic 층: 입력 -> 슬롯 갱신 ----------
REQUIRED.forEach(function (f) {
  f.el.addEventListener("input", function () {
    formData[f.key] = f.el.value;
    if (f.el.tagName === "SELECT") f.el.classList.toggle("placeholder", f.el.value === "");
    f.el.classList.remove("error");
    render();
  });
});

document.querySelectorAll('input[name="pref"]').forEach(function (cb) {
  cb.addEventListener("change", function () {
    // prefs 는 append: 이전 선택이 남는다
    if (cb.checked) {
      if (formData.prefs.indexOf(cb.value) === -1) formData.prefs.push(cb.value);
    } else {
      formData.prefs = formData.prefs.filter(function (v) { return v !== cb.value; });
    }
  });
});

// ---------- Logic 층: 검증 ----------
function validate() {
  return REQUIRED.filter(function (f) {
    const v = formData[f.key];
    if (v === "" || v === null) return true;
    if (f.key === "people") {
      const n = Number(v);
      return !Number.isInteger(n) || n < 1 || n > 20;
    }
    return false;
  });
}

function render() {
  if (submitted) return;
  const missing = validate();
  statusEl.classList.remove("warn", "ready");
  if (missing.length === 0) {
    statusEl.textContent = "예약할 준비가 되었어요.";
    statusEl.classList.add("ready");
  } else {
    statusEl.textContent = "입력 내용을 확인해 주세요.";
  }
}

// ---------- Logic 층: 제출 ----------
document.getElementById("reserve-form").addEventListener("submit", function (e) {
  e.preventDefault();
  if (submitted) return;

  const missing = validate();
  REQUIRED.forEach(function (f) { f.el.classList.remove("error"); });

  if (missing.length > 0) {
    missing.forEach(function (f) { f.el.classList.add("error"); });
    statusEl.textContent = missing.map(function (f) { return f.label; }).join(", ") + " 항목을 확인해 주세요.";
    statusEl.className = "status warn";
    missing[0].el.focus();
    return;
  }

  // API 층: 현재는 없음. 서버 연동 시 POST /api/reservations, body = formData
  document.getElementById("s-region").textContent = formData.region;
  document.getElementById("s-cuisine").textContent = formData.cuisine;
  document.getElementById("s-price").textContent = formData.price;
  document.getElementById("s-people").textContent = formData.people + "명";
  document.getElementById("s-time").textContent = formData.time;
  document.getElementById("s-prefs").textContent = formData.prefs.length ? formData.prefs.join(", ") : "선택 없음";

  summary.classList.add("show");
  submitted = true;
  btn.textContent = "예약 완료";
  btn.classList.add("done");
  statusEl.textContent = "예약이 접수되었어요.";
  statusEl.className = "status ready";
});

render();
</script>
</body>
</html>
