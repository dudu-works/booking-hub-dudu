<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 피드백 분류기</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --line: #262b38;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-hover: #4a7bf0;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 14px 16px;
    resize: vertical;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit;
    font-size: 15px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #5a6176; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    min-height: 20px;
  }
  .meta .err { color: var(--danger); }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .submit {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    font-size: 15px;
    background: var(--accent);
    color: #fff;
  }
  .submit:hover:not(:disabled) { background: var(--accent-hover); }
  .submit:disabled { opacity: 0.55; cursor: not-allowed; }

  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.65);
  }
  .overlay.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
  }
  .modal h2 { margin: 0 0 20px; font-size: 18px; font-weight: 700; }
  .row {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  .row:first-of-type { border-top: none; }
  .row .k { color: var(--muted); font-size: 14px; }
  .row .v { word-break: break-word; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: #23283a;
    color: var(--text);
  }
  .badge.high { background: #3a1f26; color: #ff8b8b; }
  .badge.mid { background: #3a3320; color: #ffcc70; }
  .badge.low { background: #1f3128; color: #7fd6a2; }
  pre {
    margin: 0;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    color: var(--text);
  }
  .modal .error { color: var(--danger); font-size: 15px; }
  .confirm {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    font-size: 15px;
    background: var(--accent);
    color: #fff;
  }
  .confirm:hover { background: var(--accent-hover); }
</style>
</head>
<body>
  <main class="card">
    <h1>고객 피드백 분류기</h1>
    <p class="sub">피드백 한 문장을 넣으면 유형과 긴급도, 다음 행동을 분류합니다.</p>

    <form id="form">
      <textarea id="feedback" maxlength="500" placeholder="예) 결제 버튼을 누르면 앱이 그냥 꺼집니다."></textarea>
      <div class="meta">
        <span id="msg"></span>
        <span id="count">0 / 500</span>
      </div>
      <button type="submit" class="submit" id="submit">확인</button>
    </form>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">분석 결과</h2>
      <div id="body"></div>
      <button type="button" class="confirm" id="confirm">확인</button>
    </div>
  </div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('feedback');
  const submit = document.getElementById('submit');
  const msg = document.getElementById('msg');
  const count = document.getElementById('count');
  const overlay = document.getElementById('overlay');
  const body = document.getElementById('body');
  const confirm = document.getElementById('confirm');

  const URGENCY = { '높음': 'high', '중간': 'mid', '낮음': 'low' };

  input.addEventListener('input', () => {
    count.textContent = input.value.length + ' / 500';
    msg.textContent = '';
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function open(html) {
    body.innerHTML = html;
    overlay.classList.add('open');
    confirm.focus();
  }

  function close() {
    overlay.classList.remove('open');
    input.focus();
  }

  function render(data) {
    const f = data.fields || {};
    if (!f.type && !f.urgency) {
      return '<pre>' + esc(data.raw || '') + '</pre>';
    }
    const rows = [
      ['유형', f.type ? '<span class="badge">' + esc(f.type) + '</span>' : ''],
      ['긴급도', f.urgency
        ? '<span class="badge ' + (URGENCY[f.urgency] || '') + '">' + esc(f.urgency) + '</span>'
        : ''],
      ['판단 이유', esc(f.reason || '')],
      ['다음 행동', esc(f.action || '')]
    ];
    return rows
      .filter(([, v]) => v)
      .map(([k, v]) => '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>')
      .join('');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const feedback = input.value.trim();
    if (!feedback) {
      msg.innerHTML = '<span class="err">피드백을 입력해주세요</span>';
      input.focus();
      return;
    }

    submit.disabled = true;
    submit.textContent = '분석 중...';
    msg.textContent = '';

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ feedback })
      });
      const data = await res.json();
      if (!res.ok) {
        open('<p class="error">' + esc(data.error || '요청에 실패했습니다.') + '</p>');
      } else {
        open(render(data));
      }
    } catch (err) {
      open('<p class="error">' + esc('네트워크 오류: ' + err.message) + '</p>');
    } finally {
      submit.disabled = false;
      submit.textContent = '확인';
    }
  });

  confirm.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) close();
  });
</script>
</body>
</html>
