<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피 판매 등록 - 무인 자판기</title>
<style>
  :root {
    --ink: #183027;
    --muted: #64736c;
    --paper: #f7f5ed;
    --panel: #fffdf6;
    --line: #d7dbcf;
    --green: #257357;
    --green-soft: #dff0e7;
    --orange: #dd7b35;
  }
  * { box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", Pretendard, sans-serif; color: var(--ink); background: var(--paper); max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 8px 25px rgba(24,48,39,.06); }
  label { display: block; margin: 14px 0 4px; font-weight: 700; font-size: 14px; }
  label .opt { font-weight: 400; color: var(--muted); font-size: 12px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #bfc9bf; border-radius: 8px; font-size: 15px; background: #fff; color: var(--ink); font-family: inherit; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--green-soft); border-color: var(--green); }
  button { margin-top: 18px; width: 100%; padding: 12px 22px; background: var(--orange); color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(.96); }
  button:disabled { opacity: .55; cursor: wait; }
  #done { display: none; color: var(--green); font-weight: 700; margin-top: 14px; }
</style>
</head>
<body>
<h1>커피 판매 등록</h1>
<p class="lead">무인 커피 자판기 매출 정보를 기록해주세요. 판매 내역은 즉시 통계에 반영됩니다.</p>
<div class="card">
<form id="f">
  <label for="buyer_name">구매자 이름</label>
  <input id="buyer_name" name="buyer_name" type="text" required maxlength="40">
  <label for="product">커피 종류</label>
  <select id="product" name="product">
    <option value="">-- 선택하세요 --</option>
    <option value="아메리카노" data-price="3500">아메리카노 (3,500원)</option>
    <option value="카페라떼" data-price="4500">카페라떼 (4,500원)</option>
    <option value="카푸치노" data-price="4500">카푸치노 (4,500원)</option>
    <option value="헤이즐넛라떼" data-price="5000">헤이즐넛라떼 (5,000원)</option>
    <option value="아이스 아메리카노" data-price="4000">아이스 아메리카노 (4,000원)</option>
    <option value="아이스 라떼" data-price="5000">아이스 라떼 (5,000원)</option>
  </select>
  <label for="quantity">수량</label>
  <input id="quantity" name="quantity" type="number" required min="1" max="10" value="1">
  <div style="margin-top: 18px; padding: 12px; background: rgba(37, 115, 87, .06); border-radius: 8px; text-align: center;">
    <div style="font-size: 13px; color: var(--muted); margin-bottom: 4px;">결제 금액</div>
    <div id="total_display" style="font-size: 22px; font-weight: 700; color: var(--green);">0원</div>
  </div>
  <button type="submit">판매 등록하기</button>
</form>
<p id="done">판매 내역이 등록됐습니다. 감사합니다.</p>
</div>
<script>
const productPrices = {
  '아메리카노': 3500,
  '카페라떼': 4500,
  '카푸치노': 4500,
  '헤이즐넛라떼': 5000,
  '아이스 아메리카노': 4000,
  '아이스 라떼': 5000
};

function updateTotal() {
  const product = document.getElementById("product").value;
  const quantity = parseInt(document.getElementById("quantity").value) || 1;
  const price = productPrices[product] || 0;
  const total = price * quantity;
  document.getElementById("total_display").textContent = total.toLocaleString() + '원';
}

document.getElementById("product").addEventListener("change", updateTotal);
document.getElementById("quantity").addEventListener("change", updateTotal);
document.getElementById("quantity").addEventListener("input", updateTotal);

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.target.querySelector("button");
  const product = document.getElementById("product").value;

  if (!product) {
    alert("커피 종류를 선택해주세요");
    return;
  }

  const body = {
    buyer_name: document.getElementById("buyer_name").value,
    product: product,
    quantity: parseInt(document.getElementById("quantity").value),
    price_per_unit: productPrices[product]
  };
  button.disabled = true;
  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      document.getElementById("f").style.display = "none";
      document.getElementById("done").style.display = "block";
    } else {
      alert("등록 실패 - 화면을 캡처해 채팅에 올려 주세요 (" + res.status + ")");
    }
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
