<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 목록 - 커피 자판기</title>
<style>
  :root {
    --ink: #183027;
    --muted: #64736c;
    --paper: #f7f5ed;
    --panel: #fffdf6;
    --line: #d7dbcf;
    --green: #257357;
    --green-soft: #dff0e7;
    --orange: #dd7b35;
  }
  * { box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", Pretendard, sans-serif; color: var(--ink); background: var(--paper); max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  .content-wrapper { display: flex; gap: 24px; align-items: flex-start; }
  .list-container { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 8px 25px rgba(24,48,39,.06); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 500px; }
  th { text-align: left; padding: 12px; border-bottom: 2px solid var(--line); font-weight: 700; font-size: 13px; color: var(--muted); background: rgba(37, 115, 87, .04); }
  td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  tr { cursor: pointer; transition: background 0.1s; }
  tr:hover { background: rgba(37, 115, 87, .08); }

  .detail-panel { flex-shrink: 0; width: 280px; padding: 18px; background: rgba(37, 115, 87, .06); border-left: 4px solid var(--green); border-radius: 8px; display: none; position: sticky; top: 40px; }
  .detail-panel.active { display: block; }
  .detail-title { font-weight: 700; font-size: 16px; margin: 0 0 12px; }
  .detail-row { margin: 8px 0; }
  .detail-label { font-weight: 700; font-size: 13px; color: var(--muted); }
  .detail-value { margin-top: 2px; font-size: 14px; line-height: 1.6; }

  .loading { text-align: center; color: var(--muted); padding: 40px; }
  .error { color: #c41e3a; padding: 16px; background: #fff0f0; border-radius: 8px; margin: 18px 0; }
</style>
</head>
<body>
<h1>판매 현황</h1>
<p class="lead">커피 자판기 매출 내역을 확인하세요. 행을 클릭하면 상세 정보가 나타납니다.</p>

<div class="content-wrapper">
<div class="list-container">
  <div id="loading" class="loading">로딩 중...</div>
  <div id="error"></div>
  <table id="listTable" style="display: none;">
    <thead>
      <tr>
        <th>순번</th>
        <th>구매자</th>
        <th>상품</th>
        <th>수량</th>
        <th>금액</th>
        <th>시각</th>
      </tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
</div>

<div id="detailPanel" class="detail-panel">
  <div class="detail-title" id="detailBuyerName"></div>
  <div class="detail-row">
    <div class="detail-label">상품</div>
    <div class="detail-value" id="detailProduct"></div>
  </div>
  <div class="detail-row">
    <div class="detail-label">수량</div>
    <div class="detail-value" id="detailQuantity"></div>
  </div>
  <div class="detail-row">
    <div class="detail-label">단가</div>
    <div class="detail-value" id="detailPrice"></div>
  </div>
  <div class="detail-row">
    <div class="detail-label">합계</div>
    <div class="detail-value" id="detailTotal" style="font-weight: 700; color: var(--green); font-size: 16px;"></div>
  </div>
  <div class="detail-row">
    <div class="detail-label">구매 시각</div>
    <div class="detail-value" id="detailCreatedAt"></div>
  </div>
</div>
</div>

<script>
async function loadList() {
  try {
    const res = await fetch('/api/list');
    if (!res.ok) throw new Error(`${res.status} 에러 발생`);
    const json = await res.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('listTable').style.display = 'table';

    const tbody = document.getElementById('listBody');
    json.data.forEach(row => {
      const tr = document.createElement('tr');
      const date = new Date(row.purchased_at);
      const dateStr = date.toLocaleString('ko-KR');

      tr.innerHTML = `
        <td>#${row.id}</td>
        <td>${row.buyer_name}</td>
        <td>${row.product}</td>
        <td>${row.quantity}개</td>
        <td>${row.total_price.toLocaleString()}원</td>
        <td>${dateStr}</td>
      `;

      tr.addEventListener('click', () => showDetail(row));
      tbody.appendChild(tr);
    });
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').innerHTML = `
      <div class="error">
        <strong>로드 실패</strong><br>
        ${err.message}<br>
        <small>화면을 새로고침 하거나 채팅에 알려주세요.</small>
      </div>
    `;
  }
}

function showDetail(row) {
  const date = new Date(row.purchased_at);
  const dateStr = date.toLocaleString('ko-KR');

  document.getElementById('detailBuyerName').textContent = row.buyer_name;
  document.getElementById('detailProduct').textContent = row.product;
  document.getElementById('detailQuantity').textContent = row.quantity + '개';
  document.getElementById('detailPrice').textContent = row.price_per_unit.toLocaleString() + '원';
  document.getElementById('detailTotal').textContent = row.total_price.toLocaleString() + '원';
  document.getElementById('detailCreatedAt').textContent = dateStr;

  document.getElementById('detailPanel').classList.add('active');
}

loadList();
</script>
</body>
</html>
